server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: escriba-pos

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:escriba_pos}
    username: ${DB_USER:escriba_user}
    password: ${DB_PASSWORD:escriba_secret_2025}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V1 = esquema base. En entornos donde database/init/*.sql ya corrió,
    # Flyway baselinea en 1 (salta V1) y aplica V2+ (seed demo + admin POS).
    # En BD vacías Flyway aplica la cadena completa V1..V8.
    baseline-version: 1
    out-of-order: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # Mail
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:notificaciones@escriba.co}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Bogota

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Security
app:
  jwt:
    secret: ${JWT_SECRET:escriba-jwt-secret-key-must-be-256-bits-long-minimum-for-hs256-algorithm}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: 2592000000 # 30 days

  # Admin JWT (separado del JWT de clientes)
  admin:
    jwt:
      secret: ${ADMIN_JWT_SECRET:escriba-admin-jwt-secret-key-must-be-at-least-384-bits}
      access-expiration-ms: ${ADMIN_JWT_ACCESS_EXPIRATION:14400000}      # 4 horas
      refresh-expiration-ms: ${ADMIN_JWT_REFRESH_EXPIRATION:28800000}     # 8 horas
      impersonation-expiration-ms: ${ADMIN_IMPERSONATION_EXPIRATION:7200000} # 2 horas
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  dian:
    sandbox: ${DIAN_SANDBOX:true}
    provider: FACTUS
    api-base-url: https://api.factus.com.co
  upload:
    path: ${UPLOAD_PATH:./uploads}
    max-file-size: 5242880 # 5MB

# Logging
logging:
  level:
    root: INFO
    com.escriba: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: com.escriba.pos.controller
